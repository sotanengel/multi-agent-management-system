[project]
name = "mams-model-gateway"
version = "0.1.0"
description = "MAMS Model Gateway - LLM provider abstraction"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.28",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_model_gw"]

[tool.uv.sources]
mams-core = { workspace = true }
