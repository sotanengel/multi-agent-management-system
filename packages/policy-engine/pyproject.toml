[project]
name = "mams-policy-engine"
version = "0.1.0"
description = "MAMS Policy Engine - role authorization"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_policy"]

[tool.uv.sources]
mams-core = { workspace = true }
