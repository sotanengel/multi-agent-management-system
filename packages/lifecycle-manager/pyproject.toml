[project]
name = "mams-lifecycle-manager"
version = "0.1.0"
description = "MAMS Agent Lifecycle Manager"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "docker>=7.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_lifecycle"]

[tool.uv.sources]
mams-core = { workspace = true }
