[project]
name = "mams-agent-runtime"
version = "0.1.0"
description = "MAMS Agent Runtime - runs inside agent containers"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "nats-py>=2.7",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_agent"]

[tool.uv.sources]
mams-core = { workspace = true }
