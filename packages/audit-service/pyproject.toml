[project]
name = "mams-audit-service"
version = "0.1.0"
description = "MAMS Audit and Log Service"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "nats-py>=2.7",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_audit"]

[tool.uv.sources]
mams-core = { workspace = true }
