[project]
name = "mams-api-gateway"
version = "0.1.0"
description = "MAMS API Gateway - external entry point"
requires-python = ">=3.12"
dependencies = [
    "mams-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "nats-py>=2.7",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mams_gateway"]

[tool.uv.sources]
mams-core = { workspace = true }
